<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine 3D - Realidade Aumentada</title>
    
    <!-- Tecnologia do Google para carregar o modelo sem travar -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container-ra {
            width: 90%;
            max-width: 400px;
            height: 400px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #ar-button {
            background-color: #0071e3;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,113,227,0.3);
            z-index: 999;
        }
        h2 {
            margin-top: 20px;
            color: #333333;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container-ra">
        <!-- Modelo Oficial da Khronos carregado por um servidor CDN livre de bloqueios -->
        <model-viewer 
            src="https://jsdelivr.net" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            tone-mapping="neutral"
            shadow-intensity="1">
            
            <button slot="ar-button" id="ar-button">
                👋 Ver no Espaço (RA)
            </button>
            
        </model-viewer>
    </div>

    <h2>Protótipo 3D Funcional</h2>

</body>
</html>
