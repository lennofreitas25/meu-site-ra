<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine 3D RA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            height: 400px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #ar-button {
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
        }
        h2 { text-align: center; margin-top: 15px; font-size: 18px; color: #333; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Usando o modelo oficial de patinho da Khronos, o mais leve e compatível do mundo -->
        <model-viewer 
            src="https://githubusercontent.com" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            shadow-intensity="1">
            
            <button slot="ar-button" id="ar-button">
                👋 Ver no meu espaço (RA)
            </button>
            
        </model-viewer>
    </div>

    <h2>Protótipo de Teste RA</h2>

    <!-- O Script foi movido para o final do arquivo para garantir o carregamento do modelo -->
    <script type="module" src="https://googleapis.com"></script>
</body>
</html>
