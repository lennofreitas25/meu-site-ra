<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine 3D - Realidade Aumentada</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .canvas-container {
            width: 90%;
            max-width: 400px;
            height: 400px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn-ar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #0071e3;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,113,227,0.3);
            text-decoration: none;
            z-index: 10;
        }
        h2 {
            margin-top: 20px;
            color: #333333;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <div id="renderer-container" style="width: 100%; height: 100%;"></div>
        
        <a id="ar-link" rel="ar" href="#" class="btn-ar">
            👋 Ver no Espaço (RA)
        </a>
    </div>

    <h2>Protótipo 3D Funcional</h2>

    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        const container = document.getElementById('renderer-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const modelUrl = 'https://githubusercontent.com';

        const loader = new THREE.GLTFLoader();
        loader.load(
            modelUrl,
            function (gltf) {
                const model = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);
                
                scene.add(model);
            },
            undefined,
            function (error) {
                console.error('Erro de carregamento:', error);
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        const arLink = document.getElementById('ar-link');
        
        if (isAndroid) {
            arLink.href = 'intent://://githubusercontent.com';
        } else {
            arLink.href = modelUrl;
        }
    </script>
</body>
</html>
